name: release

on:
  workflow_run:
    workflows: ["tests"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for OIDC

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      # Setup Node.js configures the npm registry. Changesets uses pnpm publish
      # in this workspace. pnpm uses the OIDC permission for trusted publishing
      # and generates provenance attestations when the registry enables it.
      - name: setup node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: build project
        run: pnpm run build

      - name: create release pull request or publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: pnpm run release
          version-script: pnpm run version
          pr-title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
